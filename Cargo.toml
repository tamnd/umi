[workspace]
resolver = "3"
members = ["crates/*"]
# cargo-fuzz needs nightly and passes sanitiser flags this workspace does not
# want. It has its own lockfile and its own toolchain, so it stays out.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/tamnd/umi"
homepage = "https://umi.dev"
authors = ["Tam Nguyen <tamnd87@gmail.com>"]

[workspace.dependencies]
# Internal. Every crate that needs a URL key, a digest or an exit code
# reaches umi-types, and umi-types reaches nothing but blake3. That is
# the rule in docs/spec/03-architecture.md and it is worth keeping.
umi-types = { path = "crates/umi-types", version = "0.0.1" }
umi-state = { path = "crates/umi-state", version = "0.0.1" }
umi-file = { path = "crates/umi-file", version = "0.0.1" }
umi-proto = { path = "crates/umi-proto", version = "0.0.1" }
umi-extract = { path = "crates/umi-extract", version = "0.0.1" }
umi-robots = { path = "crates/umi-robots", version = "0.0.1" }
umi-fetch = { path = "crates/umi-fetch", version = "0.0.1" }
umi-frontier = { path = "crates/umi-frontier", version = "0.0.1" }
umi-state-sqlite = { path = "crates/umi-state-sqlite", version = "0.0.1" }
umi-publish = { path = "crates/umi-publish", version = "0.0.1" }
umi-seed = { path = "crates/umi-seed", version = "0.0.1" }
umi-dedup = { path = "crates/umi-dedup", version = "0.0.1" }
umi-crawl = { path = "crates/umi-crawl", version = "0.0.1" }

anyhow = "1"
# The state trait is used through `Box<dyn State>`, because the backend is
# chosen from config at runtime. Native async fn in traits is stable on 1.98
# but is not dyn compatible, so the boxing has to happen somewhere and this
# crate does it in one place instead of in every signature.
async-trait = "0.1"
# The hash the whole spec is written around: url keys, body digests,
# chunk trees, block checksums and manifest digests are all blake3, so
# there is one hash in the tree rather than four.
blake3 = "1"
# Doc 11.8 names xxh3 for the shingle hash, and it is the right call: the
# sketch hashes tens of thousands of five word strings per page and blake3 at
# that size is dominated by its own setup. This is not a security boundary,
# because a fetcher that wants to lie about a page lies about the text and the
# sketch follows honestly.
#
# twox-hash rather than xxhash-rust, which is the other well used port. XXH3 is
# a specified algorithm with published test vectors, so both produce the same
# u64 for the same bytes and the choice is about the crate rather than about the
# hash. twox-hash is MIT and xxhash-rust is BSL-1.0, which is permissive and
# fine but is not on deny.toml's list, and widening a dependency licence policy
# to avoid picking between two equivalent crates is the wrong trade.
twox-hash = { version = "2.1", default-features = false, features = ["xxhash3_64"] }
clap = { version = "4.6", features = ["derive", "wrap_help"] }
thiserror = "2"

# URL handling. `url` gives WHATWG parsing and `idna` gives UTS-46 with
# transitional processing off, which is what doc 11.2 step 4 asks for.
url = "2"
idna = "1"
percent-encoding = "2"

# Doc 13.2's `url_regex` matcher. The `regex` crate rather than anything with
# backtracking in it, and this is a safety property rather than a preference: a
# profile is a file an operator writes and admission runs it against every link
# on every page, so a pattern that could backtrack would be a way to stop a
# crawl by writing eight characters in a config file. Linear time matching
# means the worst a bad pattern costs is a bad pattern.
regex = "1"

# Extraction. html5ever is the parser doc 11.3 names, and markup5ever_rcdom
# is the tree it builds into.
html5ever = "0.39"
markup5ever_rcdom = "0.39"
tendril = "0.5"
unicode-normalization = "0.1"

# Fetch. rustls only, no openssl-sys anywhere in the default tree, which is
# gate 2.2 in doc 16 and is asserted in CI. Roots come from the platform store
# through rustls-platform-verifier, which is what reqwest 0.13 does on its own
# and is the right default for a fetcher somebody else runs: a host behind a
# corporate root should work without us shipping a way to add one.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "brotli", "zstd", "deflate", "stream", "charset", "http2"] }
http = "1"
bytes = "1"

# T2, doc 05.5. wreq links BoringSSL and exposes the TLS extensions and the
# HTTP/2 settings a browser profile is actually made of, rather than trying to
# reproduce a fingerprint from a hash. BoringSSL and openssl-sys share symbol
# prefixes and cannot be in one process, so this is optional here and reaches
# umi-fetch only through its non default `emulation` feature. Gate 2.2 asserts
# the default tree has neither.
#
# The four decompression features are not optional in practice. A browser
# profile sends Chrome's `Accept-Encoding`, so origins answer with brotli and
# zstd whether or not we can read them, and a client that cannot decode its own
# advertised encodings gets bytes it cannot parse. `stream` is what gives the
# body as chunks rather than one buffer, which is how the body cap is enforced
# before the bytes are in memory rather than after.
wreq = { version = "0.16", features = ["stream", "gzip", "brotli", "zstd", "deflate"] }
wreq-util = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Storage and publishing.
rusqlite = { version = "0.40", features = ["bundled"] }
arrow = "59"
parquet = { version = "59", default-features = false, features = ["arrow", "zstd", "snap", "base64"] }
zstd = "0.13"
# Doc 10.8: one column chunk per task while a shoal is encoded.
rayon = "1"

# Test only, but it belongs here rather than in one crate's dev-dependencies:
# every crate that writes a file needs a directory that cleans itself up, and
# two versions of that in one tree would be silly.
tempfile = "3"

# Doc 12.5 signs every manifest with Ed25519 and doc 04 signs every receipt
# with it, so there is one signature scheme in the tree. Verification is the
# strict form, which rejects the small order public keys that make a signature
# verify under more than one key.
ed25519-dalek = "3"
# Only for doc 12.5's second digest. blake3 is what umi computes everywhere
# else and sha256 is what every other tool on Earth can check without
# installing anything, which is the whole reason both are published.
sha2 = "0.11"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Doc 14.7's two config files. Deserialise only: umi reads configuration and
# never writes it, because a tool that rewrites the file a person edited loses
# their comments.
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
hex = "0.4"
# Doc 12.6's commit endpoint wants inline file content base64 encoded. This is
# the only place in the tree that needs it, and it is here rather than in one
# crate's dependencies so that a second caller does not arrive with a second
# version of the same twenty lines.
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The fuzz and crash suites in milestone 1 run the writer under a kill
# signal thousands of times, and a debug build is too slow to make that
# a test anyone runs. Optimised dependencies, unoptimised own code, so
# a backtrace still points at a line.
[profile.dev.package."*"]
opt-level = 2
