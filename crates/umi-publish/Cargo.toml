[package]
name = "umi-publish"
description = "Parquet conversion, the Hugging Face client, manifests and GC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
arrow = { workspace = true }
# Doc 12.6's commit endpoint takes inline file content base64 encoded, and the
# preupload sample is base64 too.
base64 = { workspace = true }
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
parquet = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# For the retry sleep in doc 12.6's ladder and nothing else. The publisher does
# not own a runtime, it runs on the caller's.
tokio = { workspace = true }
umi-file = { workspace = true }
umi-types = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# No criterion. The numbers this has to defend are doc 12.2's per segment
# budgets, which are wall clock seconds on one core and not the microsecond
# differences criterion exists to resolve, and the same reasoning is written
# out at the top of umi-file's bench.
[[bench]]
name = "publish"
harness = false
