[package]
name = "umi-crawl"
description = "The umi crawl loop: lease, fetch, extract, sketch, row"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bench]]
name = "rows"
harness = false

[[bench]]
name = "tick"
harness = false

[dependencies]
arrow.workspace = true
async-trait.workspace = true
blake3.workspace = true
futures-util.workspace = true
regex.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tokio = { workspace = true }
url.workspace = true
umi-dedup.workspace = true
umi-extract.workspace = true
umi-fetch.workspace = true
umi-file.workspace = true
umi-frontier.workspace = true
umi-robots.workspace = true
umi-seed.workspace = true
umi-state.workspace = true
umi-types.workspace = true

[dev-dependencies]
bytes.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
umi-state-sqlite.workspace = true

[features]
# Doc 05.5's T2, forwarded to umi-fetch. Nothing in this crate changes: the
# loop asks the ladder for a tier either way and the ladder decides whether it
# has that rung. The feature is here so a binary can turn T2 on without
# depending on umi-fetch directly.
emulation = ["umi-fetch/emulation"]
