[package]
name = "umi-cli"
description = "The umi command line: focused crawls, community fetching and operator commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
name = "umi_cli"
path = "src/lib.rs"

[[bin]]
name = "umi"
path = "src/main.rs"

[[bench]]
name = "cli"
harness = false

[dependencies]
umi-types.workspace = true
umi-file.workspace = true
umi-fetch.workspace = true
umi-extract.workspace = true
umi-crawl.workspace = true
umi-publish.workspace = true
umi-seed.workspace = true
umi-state.workspace = true
# The default backend and the only one built. Doc 08 puts SQLite's ceiling at
# about 100 million URLs and doc 13.5 says a focused crawl that exceeds that is
# not focused, so `--state nami` and `--state postgres` are still refused at the
# flag rather than silently falling back to this.
umi-state-sqlite.workspace = true

blake3.workspace = true
# The upload half of doc 16's gate 1.1 sends one shared buffer from every
# stream, and `Bytes` is what makes that one allocation rather than eight.
bytes.workspace = true
# `join_all` and `bytes_stream` in the bandwidth measurement. Nothing else
# in the crate needs a stream combinator.
futures-util.workspace = true

arrow.workspace = true
clap.workspace = true
hex.workspace = true
http.workspace = true
parquet.workspace = true
reqwest.workspace = true
serde.workspace = true
# `published.jsonl`. Hand writing six fields would work until the first
# repository name with a quote in it, and the crate is already in the tree
# under umi-publish.
serde_json.workspace = true
thiserror.workspace = true
# `umi get` and `doctor` want one thread and `umi crawl` wants all of them:
# gate 1.1's 250 pages a second is CPU bound in the extract and the sketch, and
# a current thread runtime would serialise that behind the fetches. The crawl
# builds the multi threaded runtime itself and the other commands keep using
# the small one.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }
toml.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `#[tokio::test]`. The crate itself builds its runtime by hand and does not
# need the macros, so they are here rather than in the dependency above.
tokio = { workspace = true, features = ["macros"] }

[features]
# Doc 05.5's T2. Off by default because it links BoringSSL, which cannot share
# a process with openssl-sys, and because gate 2.2 asserts the default build
# has neither. Build with `--features emulation` to get the rung.
emulation = ["umi-crawl/emulation", "umi-fetch/emulation"]
# Doc 05.6's T3. Off by default because it is useless without Chrome on the
# box, and because a browser holds a gigabyte or more once its tabs are warm,
# which is not something a default build should decide for somebody. Even with
# the feature on, no browser starts until `tabs` is set above zero.
render = ["umi-crawl/render", "umi-fetch/render"]
