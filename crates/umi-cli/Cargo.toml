[package]
name = "umi-cli"
description = "The umi command line: focused crawls, community fetching and operator commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
name = "umi_cli"
path = "src/lib.rs"

[[bin]]
name = "umi"
path = "src/main.rs"

[[bench]]
name = "cli"
harness = false

[dependencies]
umi-types.workspace = true
umi-file.workspace = true
umi-fetch.workspace = true
umi-extract.workspace = true
umi-crawl.workspace = true
umi-publish.workspace = true
umi-seed.workspace = true
umi-state.workspace = true
# The default backend and the only one built. Doc 08 puts SQLite's ceiling at
# about 100 million URLs and doc 13.5 says a focused crawl that exceeds that is
# not focused, so `--state nami` and `--state postgres` are still refused at the
# flag rather than silently falling back to this.
umi-state-sqlite.workspace = true

blake3.workspace = true

arrow.workspace = true
clap.workspace = true
hex.workspace = true
http.workspace = true
parquet.workspace = true
reqwest.workspace = true
serde.workspace = true
thiserror.workspace = true
# `umi get` and `doctor` want one thread and `umi crawl` wants all of them:
# gate 1.1's 250 pages a second is CPU bound in the extract and the sketch, and
# a current thread runtime would serialise that behind the fetches. The crawl
# builds the multi threaded runtime itself and the other commands keep using
# the small one.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }
toml.workspace = true
url.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
