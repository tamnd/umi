<!DOCTYPE html>

<head><title>Gallery</title></head>
<body>
<div id="app">
  <noscript>
    <h1>The whole page, for readers without scripts</h1>
    <p>Some sites put a complete copy of the content inside a noscript block, which is
    thoughtful and which we drop anyway, because doc 11.3 says noscript is dropped and a
    browser at the rendered tier will not show it either.</p>
    <p>What survives is whatever the page said outside the block.</p>
  </noscript>
  <div class="fallback">
    <p>Enable images to see the gallery. The captions are below and they are the only
    text on this page that a browser would actually paint on the screen.</p>
    <p>Twelve photographs of the same lighthouse in different weather, taken over one
    winter from the same spot on the breakwater.</p>
  </div>
</div>
</body>
</html>
