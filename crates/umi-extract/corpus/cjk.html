<!DOCTYPE html>
<html lang="ja">
<head><meta charset="utf-8"><title>海と時間</title></head>
<body>
<article>
  <h1>海は時間を数える</h1>
  <p>潮の満ち引きは、人が目で見ることのできるもっとも遅い時計である。振り子時計が
  발명되기 전까지、港の番人は石壁に刻まれた線を見て時刻を知ることができた。</p>
  <p>全角の句読点、たとえば「、」や「。」、そして丸括弧（かっこ）は、NFKC を掛けると
  半角に潰れてしまう。だから doc 11.3 は NFC を選んでいる。</p>
  <ul>
    <li>大潮は新月と満月のあと</li>
    <li>小潮は上弦と下弦のあと</li>
  </ul>
  <p>中文段落：海不着急，也从不迟到。这一句用来确认中日韩文字在没有空格的情况下也能
  正确地保留下来，而不会被空白折叠规则切碎。</p>
</article>
</body>
</html>
