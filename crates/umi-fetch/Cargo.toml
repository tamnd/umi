[package]
name = "umi-fetch"
description = "The tier ladder, the HTTP clients and the browser pool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
umi-types = { workspace = true }

blake3 = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
wreq = { workspace = true, optional = true }
wreq-util = { workspace = true, optional = true }

[features]
# Doc 05.5's T2. Off by default, and it has to stay off by default: wreq links
# BoringSSL, which shares symbol prefixes with openssl-sys, and a tree holding
# both either fails to link or links and segfaults.
emulation = ["dep:wreq", "dep:wreq-util"]
