[package]
name = "umi-fetch"
description = "The tier ladder, the HTTP clients and the browser pool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bench]]
name = "sign"
harness = false

# The resolver's ceiling, which is the ladder's ceiling. It needs a list of
# real hosts and it goes to the network, so it measures nothing at all unless
# UMI_DNS_LIST names one.
[[bench]]
name = "dns"
harness = false

# Doc 05.6's per page cost, which needs a real browser and so cannot be part of
# a default `cargo bench`. `required-features` is what keeps it out.
[[bench]]
name = "render"
harness = false
required-features = ["render"]

[dependencies]
umi-types = { workspace = true }

base64 = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
chromiumoxide = { workspace = true, optional = true }
# Doc 07.2's request signatures are Ed25519, the same scheme doc 12.5 uses for
# manifests and doc 04 uses for receipts. One signature scheme in the tree.
ed25519-dalek = { workspace = true }
futures-util = { workspace = true }
hickory-resolver = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Only for the RFC 7638 key thumbprint, which is SHA-256 because the JOSE
# specifications say so and a verifier reaching for a JWK library expects it.
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
wreq = { workspace = true, optional = true }
wreq-util = { workspace = true, optional = true }

# Gate 2.2's other half, and Linux only for a reason that is worth writing
# down. The default tree already links aws-lc-sys, which rustls uses and which
# is a BoringSSL fork, and it renames its own BoringSSL symbols so that nothing
# else can collide with them. `btls` does the same rename only when asked, so
# we ask.
#
# We can only ask on Linux. The build script does the rename with `objcopy`,
# skips it on macOS and Windows, and applies the matching `link_name` overrides
# to the generated bindings regardless, so a macOS build with the feature on
# fails at link time looking for symbols nothing renamed. That is a bug in the
# crate rather than a decision, and a target section is the way to route around
# it without giving up the protection on the platform the fleet runs.
[target.'cfg(target_os = "linux")'.dependencies]
wreq = { workspace = true, optional = true, features = ["prefix-symbols"] }

[dev-dependencies]
rustls = { workspace = true }
tokio-rustls = { workspace = true }

[features]
# Doc 05.5's T2. Off by default, and it has to stay off by default: wreq links
# BoringSSL, which shares symbol prefixes with openssl-sys, and a tree holding
# both either fails to link or links and segfaults.
emulation = ["dep:wreq", "dep:wreq-util"]
# Doc 05.6's T3. Off by default because it is useless without a Chrome or
# Chromium binary on the box, and a fetcher that fails to start on a machine
# with no browser would be a worse default than one that simply has no T3.
# Nothing here links a second TLS stack, so this feature and `emulation` can be
# on together and the fleet turns both on.
render = ["dep:chromiumoxide"]
