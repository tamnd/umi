[package]
name = "umi-state-sqlite"
description = "SQLite state backend, the portable default"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
umi-types = { workspace = true }
umi-state = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
rusqlite = { workspace = true }
# Only for `block_in_place`, so a long transaction does not sit on a runtime
# worker thread. Nothing here spawns and nothing here needs a reactor.
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = { workspace = true }

# No criterion, for the same reason as umi-file and umi-publish. The numbers
# this has to defend are doc 08.5's rates and doc 01's bytes a url, which are
# wall clock over a batch of a thousand and not the microsecond differences
# criterion exists to resolve.
[[bench]]
name = "state"
harness = false
