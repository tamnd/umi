[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # blake3 is dual licensed CC0 or Apache-2.0, and it is the hash the
  # whole spec is written around.
  "CC0-1.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  # webpki-root-certs is the Mozilla CA root bundle that rustls-platform-verifier
  # falls back to, and CDLA-Permissive-2.0 is a data licence rather than a code
  # one. It grants use, modification and redistribution with no conditions
  # attached to either the data or anything built from it, which is the same
  # deal the permissive code licences above give us.
  "CDLA-Permissive-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
