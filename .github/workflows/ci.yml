name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Every job below inherits the toolchain from rust-toolchain.toml, which
  # pins 1.98. That makes the ordinary jobs the minimum supported version
  # check as well, and it means a laptop and a runner disagree about the
  # compiler only if somebody edits that file. The `stable` job is the one
  # that deliberately breaks the pin, so that a change landing in a newer
  # release is seen here rather than in somebody's editor months later.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Default features here, and in the test and stable jobs below. The one
      # feature the workspace has is `emulation`, which links BoringSSL and
      # takes minutes to compile, and doc 05.5 is explicit that it is not part
      # of an ordinary build. The emulation job is where that rung is checked.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --workspace

  # Doc 16's gate 1.2. Doc 11.1 promises byte identical extraction on every
  # machine forever, and doc 06 makes that promise load bearing, because a
  # fetcher somebody else runs is trusted by comparing its extraction against
  # ours. The twenty three document corpus in the repository is checked by the
  # ordinary test job; this is the ten thousand real pages that catch the
  # divergences nobody thought to write a fixture for.
  #
  # The corpus is 1.5 GB of HTML, so it lives in a dataset rather than in git
  # and is cached here by the digest the golden file records. A cache that
  # served the wrong file would be caught anyway: the test digests what it
  # opened and compares that against the same recorded line before it looks at
  # a single page.
  golden:
    name: golden corpus (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Which corpus the digests were recorded against
        id: corpus
        run: |
          set -e
          digest=$(sed -n 's/^corpus blake3=//p' crates/umi-extract/golden/wide.txt)
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: corpus/wide.parquet
          key: golden-${{ steps.corpus.outputs.digest }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p corpus
          curl -sSfL -o corpus/wide.parquet \
            https://huggingface.co/datasets/open-index/umi-golden/resolve/main/wide.parquet
      # Release, because the same comparison in a debug build takes twelve
      # minutes rather than ninety seconds, and the three operating systems
      # here are already three independently compiled binaries. The debug
      # against release comparison is in docs/spec/11-extraction-and-dedup.md.
      #
      # An absolute path, because cargo gives an integration test the package
      # directory as its working directory, and `corpus/wide.parquet` from
      # crates/umi-extract is a real directory holding the other corpus.
      - env:
          UMI_GOLDEN_CORPUS: ${{ github.workspace }}/corpus/wide.parquet
        run: cargo test -p umi-extract --test wide --release -- --ignored --nocapture

  # The pin says 1.98 and the README says 1.98, so a build that only works
  # on something newer is a bug in one of them. This job asserts it out
  # loud instead of trusting the file.
  msrv:
    name: msrv is 1.98
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98
      - uses: Swatinem/rust-cache@v2
      - name: The pin, the manifest and the toolchain all say 1.98
        run: |
          set -e
          grep -q 'channel = "1.98"' rust-toolchain.toml
          grep -q 'rust-version = "1.98"' Cargo.toml
          test "$(rustc +1.98 --version | cut -d' ' -f2)" = 1.98.0
      - env:
          RUSTUP_TOOLCHAIN: "1.98"
        run: cargo build --workspace --locked

  # RUSTUP_TOOLCHAIN beats rust-toolchain.toml, which is how this job gets
  # past the pin. Allowed to fail: a new lint in a release nobody has
  # adopted yet is information, not a broken build.
  stable:
    name: current stable
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Doc 05.5's T2, and doc 16's gate 2.2. Two things are checked here and they
  # pull in opposite directions: that the rung still compiles and passes its
  # tests, and that it stays out of everything that did not ask for it.
  #
  # Ubuntu only, on purpose. T2 links BoringSSL, which is a cmake and Go
  # toolchain build measured in minutes, and the fleet doc 15 describes runs
  # Linux. A break in this rung on macOS or Windows is worth knowing about but
  # is not worth three times the CI bill on every pull request.
  emulation:
    name: emulation feature (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Before anything is compiled, because this is the check that says the
      # default tree has no BoringSSL and no OpenSSL in it, and it reads
      # `cargo tree` rather than a build.
      - run: ./scripts/check-tls.sh
      - run: cargo clippy -p umi-cli --all-targets --features emulation -- -D warnings
      # The live fingerprint check stays ignored here. It talks to a third
      # party echo endpoint, and a test that goes red because somebody else is
      # rate limiting us is a test people learn to ignore. Run it by hand after
      # a dependency bump, as the doc comment on it says.
      #
      # tests/tls.rs is gate 2.2's crash suite and it is the reason this job is
      # a three platform matrix rather than one Ubuntu runner. The gate asks
      # for the emulation build to have been run on every release platform,
      # because a symbol collision does not fail a build, it segfaults later on
      # a machine that is not the one it was compiled on.
      - run: cargo test -p umi-fetch --features emulation
      # And the static half of the same gate: no BoringSSL entry point is
      # exported under its bare name. Linux only, and the script says so and
      # exits clean on the other two, because objcopy is what does the rename.
      - run: ./scripts/check-symbols.sh
      # The doc comments on the T2 types only exist in this build, so the
      # rustdoc job cannot see them and an intra doc link into the emulated
      # module goes stale without anything saying so. Once is enough for a
      # thing that does not vary by platform.
      - if: matrix.os == 'ubuntu-latest'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p umi-fetch --features emulation --no-deps

  # Doc 05.6's T3. Ubuntu only and one job, which is a smaller commitment than
  # the emulation matrix above for a reason: T3 links no TLS stack of its own,
  # so there is no symbol collision to catch on a platform we did not compile
  # on, and the whole of the policy is pure functions that behave the same
  # everywhere. What this job is actually for is that the module only compiles
  # under a feature nobody else turns on, so without it a rename in
  # chromiumoxide would land on somebody's laptop months later.
  #
  # No Chrome is installed and none is needed. The tests here never launch a
  # browser, on purpose, and the pool is exercised by the render bench and by a
  # real crawl on the fleet.
  render:
    name: render feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p umi-fetch --all-targets --features render -- -D warnings
      - run: cargo test -p umi-fetch --features render
      # The crate that spends the budget and the binary that turns the feature
      # on. Neither has anything behind a cfg, so what this catches is the
      # feature forwarding itself: a `render = [...]` line that names a crate
      # wrong compiles fine until somebody tries to use it.
      - run: cargo clippy -p umi-cli --all-targets --features render -- -D warnings
      - run: cargo test -p umi-crawl --features render
      # Both rungs at once is what the fleet builds, and the thing worth
      # proving is that BoringSSL and chromiumoxide's tree link together.
      - run: cargo test -p umi-fetch --features emulation,render
      # Same reason as the emulation job: these doc comments exist only in this
      # build, so the rustdoc job cannot see them.
      - env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p umi-fetch --features render --no-deps

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The specification is the deliverable that came before the code, and it
  # is written to a house style. A style nothing checks is a style that
  # lasts about three commits.
  spec:
    name: spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-spec.sh
      # Doc comments across the workspace cite spec sections by filename.
      # A citation pointing at a file that no longer exists is worse than
      # no citation, because it reads as authoritative.
      - name: Every spec file cited from the code exists
        run: |
          set -e
          missing=0
          for ref in $(grep -rho --exclude-dir=target --exclude-dir=.git --exclude-dir=spec 'docs/spec/[0-9][0-9]-[a-z0-9-]*\.md' . | sort -u); do
            if [ ! -f "$ref" ]; then
              echo "cited but missing: $ref"
              missing=1
            fi
          done
          exit $missing

  # The bot page states the robots token, the addresses and the user agent
  # string, and every one of those is also a constant in the code. A page
  # that has drifted from the binary is worse than no page, because an
  # operator acts on it.
  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-site.sh

  # Nothing here has an implementation yet, so the one runtime claim worth
  # making is that the command line parses and that an unbuilt command
  # says so rather than pretending. `umi --help` also has to work on a
  # machine with no config and no state.
  cli:
    name: cli surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - name: The parser is wired up
        run: |
          set -e
          ./target/debug/umi --help > /dev/null
          ./target/debug/umi crawl --help > /dev/null
          ./target/debug/umi fetch --help > /dev/null
          ./target/debug/umid --help > /dev/null
          # Exit 1 with a milestone pointer is the contract for a command
          # that is specified and not built. A zero here would mean a
          # command silently did nothing.
          if ./target/debug/umi resume /tmp/not-a-crawl; then
            echo "umi resume exited 0 but the crawl loop is not built"
            exit 1
          fi
          # A watch is a resume that does not stop, so it has to reach the
          # same loop and refuse the same directory. Exiting 0 here would
          # mean it had quietly gone back to being the unbuilt stub.
          if ./target/debug/umi watch /tmp/not-a-crawl; then
            echo "umi watch exited 0 on something that is not a crawl directory"
            exit 1
          fi
      - name: The commands that are built behave
        run: |
          set -e
          # `--offline` so the runner does not need the network and the job
          # does not go yellow when huggingface.co is slow. The checks that
          # matter here are the local ones anyway.
          ./target/debug/umi doctor --offline
          ./target/debug/umi config > /dev/null
          # Doc 14.9: nothing to list is exit 3 and not a failure. A checkout
          # has no segments in it, so this is the real path.
          set +e
          ./target/debug/umi ls . > /dev/null 2>&1
          code=$?
          set -e
          if [ "$code" != "3" ]; then
            echo "umi ls on an empty tree exited $code, doc 14.9 says 3"
            exit 1
          fi
