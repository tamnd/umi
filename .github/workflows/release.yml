name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # Sigstore trades the OIDC token for a short lived certificate, so there
  # is no signing key anywhere to keep or to lose. A fetcher is a binary
  # that strangers run against other people's servers, which is a good
  # reason for it to be traceable to the commit it was built from.
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: darwin-x64
            os: macos-13
            target: x86_64-apple-darwin
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # musl so that one linux binary runs on whatever a volunteer
      # happens to have. Half the point of the fetcher protocol is that
      # somebody with a spare box can join in ten minutes, and that stops
      # being true the moment the answer involves a glibc version.
      - name: musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin umi --bin umid

      # Windows gets the command line only. `umid` is a coordinator that
      # wants systemd, cgroup limits and a tuned conntrack table, and
      # shipping something that starts but cannot hold a rate is worse
      # than shipping nothing.
      - name: Assemble the archive
        shell: bash
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          dir="umi-$version-${{ matrix.name }}"
          mkdir -p "dist/$dir"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/${{ matrix.target }}/release/umi.exe" "dist/$dir/"
          else
            cp "target/${{ matrix.target }}/release/umi" "dist/$dir/"
            cp "target/${{ matrix.target }}/release/umid" "dist/$dir/"
          fi
          cp README.md LICENSE "dist/$dir/"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$dir.zip" "$dir" > /dev/null
          else
            tar czf "$dir.tar.gz" "$dir"
          fi
          # A checksum next to every artifact, because doc 06 asks the
          # fleet to verify everything it receives and it would be odd
          # for the binary doing the verifying to arrive unverified.
          for f in "$dir".*; do
            if command -v sha256sum > /dev/null; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/umi-*.tar.gz
        if: runner.os != 'Windows'

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: dist/umi-*
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
