version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # One pull request for the routine churn. Patch bumps across a
      # thirty crate tree arriving one at a time is how a dependency
      # update becomes something nobody reads.
      patch:
        update-types: [patch]
      tokio:
        patterns: ["tokio", "tokio-*", "tower", "tower-*", "hyper", "hyper-*"]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # The ref on this one is a Rust version and not an action version,
      # so dependabot reads `@1.98` as something to bump and helpfully
      # rewrites the minimum supported version check into a check of a
      # completely different compiler. The `@stable` uses elsewhere are
      # unaffected, which is why this is an ignore rather than a pin.
      - dependency-name: dtolnay/rust-toolchain
    commit-message:
      prefix: ci
